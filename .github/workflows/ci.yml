name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Android sender client
        working-directory: apps/android-client
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon

      - name: Verify Android artifact contains no server credentials
        run: node scripts/securityCheck.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hawelly_test
          POSTGRES_USER: hawelly_test
          POSTGRES_PASSWORD: hawelly_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawelly_test -d hawelly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hawelly_test:hawelly_test_password@127.0.0.1:5432/hawelly_test?schema=public
      TEST_DATABASE_URL: postgresql://hawelly_test:hawelly_test_password@127.0.0.1:5432/hawelly_test?schema=public
      AUTH_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      AUTH_RATE_LIMIT_PEPPER: ci-only-rate-limit-pepper-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Verify
        run: npm run check

      - name: Smoke-test built API
        run: npm run smoke:health

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject critical development dependency vulnerabilities
        run: npm audit --audit-level=critical
